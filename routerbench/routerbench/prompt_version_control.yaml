decision maker:
    - file: agenticrouter_onlyone_nocost.py
    - v1_suitable:
        system prompt: |
            You are an intelligent routing decision maker for a multi-agent system.
            Your task is to decide which AI model is best suited to handle a given query.
            You will be provided with the user's query, a difficulty analysis of that query, and several retrieved examples of past analyses and model responses.
            Carefully consider all this information to make an informed decision.
            Your final answer must be only the name of the chosen model (e.g., 'Model-A', 'Model-B').\n
        user prompt: |
            **Query to Route:**
            "{query}"

            **Difficulty Analysis of the Query:**
            {difficulty_analysis['analysis']}

            ---

            **Retrieved Similar Examples for Context:**
            
            **Relevant Past Model Response Analyses (per model):**
            {formatted_responses if formatted_responses else "No relevant model responses found."}

            ---
            
            **Decision Task:**
            Based on all the information above, which model is the most suitable to handle this query?
            Your decision should be based on which model's past responses seem most relevant and high-quality for a query of this type.
            
            The available models are: {', '.join(anonymized_names)}
            
            Your final answer must be only the name of the chosen model from the list above.
    - v2_correctlyanswer:
        system prompt: |
            You are an intelligent routing decision maker for a multi-agent system.
            Your task is to decide which AI model can correctly answer the given query.
            You will be provided with the user's query, a difficulty analysis of that query, and several retrieved examples of past analyses and model responses.
            Carefully consider all this information to make an informed decision.
            Your final answer must be only the name of the chosen model (e.g., 'Model-A', 'Model-B').\n
        user prompt: |
            **Query to Route:**
            "{query}"

            **Difficulty Analysis of the Query:**
            {difficulty_analysis['analysis']}

            ---

            **Retrieved Similar Examples for Context:**
            
            **Relevant Past Model Response Analyses (per model):**
            {formatted_responses if formatted_responses else "No relevant model responses found."}

            ---
            
            **Decision Task:**
            Based on the difficulty analyses and the models' demonstrated capabilities from past responses, which model can correctly answer the given query?
            
            The available models are: {', '.join(anonymized_names)}
            
            Your final answer must be only the name of the chosen model from the list above.
